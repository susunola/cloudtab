name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...

  # End-to-end tests that compile and run the real cloudtab binary against
  # committed plan fixtures. They are hermetic by default (no cloud credentials
  # in CI; cloud resources are deterministically skipped and the EIP fixture is
  # priced locally offline). The one live-priced test skips unless credentials
  # are present, so this job never needs secrets.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Integration tests (hermetic, no creds)
        run: go test -tags integration -race ./cmd/cloudtab/

# Releases are cut manually via scripts/release.sh (builds darwin/linux ×
# amd64/arm64 and publishes to GitHub Releases). There is intentionally no
# tag-triggered release job here.
