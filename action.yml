name: "cloudtab — Multi-cloud cost estimation"
description: "Estimate monthly cloud cost (Tencent/AWS/Alibaba/Huawei) from a Terraform plan and comment on the PR."
author: "cloudtab contributors"
branding:
  icon: "trending-up"
  color: "blue"

inputs:
  path:
    description: "Path to Terraform working directory (containing .tf files)."
    required: false
    default: "."
  region:
    description: "Default Tencent Cloud region (ap-guangzhou / ap-shanghai / ...)."
    required: false
    default: "ap-guangzhou"
  base-ref:
    description: "Git ref to compare against for diff mode. Empty = breakdown only."
    required: false
    default: ""
  post-comment:
    description: "Post the result as a PR comment. Requires GITHUB_TOKEN."
    required: false
    default: "true"
  cloudtab-version:
    description: "cloudtab release to use (v0.3.20+ with checksums). 'latest' installs the newest published binary."
    required: false
    default: "latest"
  policy-file:
    description: "Repository-relative path to a strict version 1 cloudtab cost policy."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Install cloudtab
      shell: bash
      env:
        CLOUDTAB_VERSION: ${{ inputs.cloudtab-version }}
      run: |
        set -euo pipefail
        "$GITHUB_ACTION_PATH/scripts/install-action.sh" "$CLOUDTAB_VERSION"

    - name: Run cloudtab
      id: run
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        TENCENTCLOUD_SECRET_ID: ${{ env.TENCENTCLOUD_SECRET_ID }}
        TENCENTCLOUD_SECRET_KEY: ${{ env.TENCENTCLOUD_SECRET_KEY }}
        AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
        ALIBABA_ACCESS_KEY_ID: ${{ env.ALIBABA_ACCESS_KEY_ID }}
        ALIBABA_ACCESS_KEY_SECRET: ${{ env.ALIBABA_ACCESS_KEY_SECRET }}
        HUAWEI_ACCESS_KEY_ID: ${{ env.HUAWEI_ACCESS_KEY_ID }}
        HUAWEI_SECRET_ACCESS_KEY: ${{ env.HUAWEI_SECRET_ACCESS_KEY }}
        HUAWEI_PROJECT_ID: ${{ env.HUAWEI_PROJECT_ID }}
        CLOUDTAB_POLICY_FILE: ${{ inputs.policy-file }}
      run: |
        set -euo pipefail
        POLICY_ARGS=()
        if [ -n "$CLOUDTAB_POLICY_FILE" ]; then
          POLICY_ARGS+=(--policy-file "$GITHUB_WORKSPACE/$CLOUDTAB_POLICY_FILE")
        fi
        terraform init -input=false -no-color
        terraform plan -out=plan.new.tfplan -no-color
        terraform show -json plan.new.tfplan > plan.new.json

        if [ -n "${{ inputs.base-ref }}" ]; then
          # Build baseline from base ref in a worktree
          git fetch origin "${{ inputs.base-ref }}" --depth=1
          WT=$(mktemp -d)
          trap 'git worktree remove "$WT" >/dev/null 2>&1 || true' EXIT
          git worktree add "$WT" FETCH_HEAD
          (
            cd "$WT/${{ inputs.path }}"
            terraform init -input=false -no-color
            terraform plan -out=plan.old.tfplan -no-color || true
            if [ -f plan.old.tfplan ]; then
              terraform show -json plan.old.tfplan > "$OLDPWD/plan.old.json"
            fi
          )
          if [ -f plan.old.json ]; then
            status=0
            cloudtab diff --before plan.old.json --after plan.new.json \
              --region "${{ inputs.region }}" --format markdown \
              "${POLICY_ARGS[@]}" > comment.md || status=$?
          else
            # No baseline plan (e.g. first run): fall back to a plain breakdown.
            status=0
            cloudtab breakdown --path plan.new.json --region "${{ inputs.region }}" \
              "${POLICY_ARGS[@]}" > comment.md || status=$?
          fi
        else
          status=0
          cloudtab breakdown --path plan.new.json --region "${{ inputs.region }}" \
            "${POLICY_ARGS[@]}" > comment.md || status=$?
        fi
        if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
          exit "$status"
        fi
        echo "comment_file=comment.md" >> "$GITHUB_OUTPUT"
        echo "exit_code=$status" >> "$GITHUB_OUTPUT"

    - name: Post PR comment
      if: inputs.post-comment == 'true' && github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: cloudtab
        path: ${{ inputs.path }}/${{ steps.run.outputs.comment_file }}

    - name: Enforce cloudtab cost policy
      if: steps.run.outputs.exit_code == '2'
      shell: bash
      run: exit 2
